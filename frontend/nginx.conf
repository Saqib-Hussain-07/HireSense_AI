# ─── HireSense AI — nginx SPA config ─────────────────────────────────────────
# Serves the React single-page application and proxies /api + /ws to the
# backend service. Handles client-side routing via try_files fallback.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Static assets — long cache (hashed filenames from Vite) ───────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── REST API — proxy to backend container ─────────────────────────────
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── WebSocket — proxy for live voice interview sessions ───────────────
    location /ws/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Uploaded resume files ─────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend:5000;
    }

    # ── React SPA — all other routes fall back to index.html ──────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
